<html lang="ar" dir="rtl">

<title>لوحة إدارة النادي</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Cairo:wght@400;700&family=Tajawal:wght@400;700&family=Amiri:wght@400;700&family=Noto+Naskh+Arabic:wght@400;700&family=Almarai:wght@400;700&family=Reem+Kufi:wght@500;700&family=Aref+Ruqaa:wght@400;700&display=swap">
<style>
:root{--teal:#0E5E5B;--gold:#A9844B;--ink:#12302F;--mute:#56706E;--line:#DAD5C6}
*{box-sizing:border-box;margin:0}body{background:#fff;color:var(--ink);font-family:"IBM Plex Sans Arabic",system-ui,sans-serif;line-height:1.7;padding-bottom:env(safe-area-inset-bottom)}
.wrap{max-width:980px;margin:auto;padding:16px}h2{margin:18px 0 10px;color:var(--teal)}h4{color:var(--teal)}
input,select,textarea,button{font:inherit}input,select,textarea{width:100%;border:1px solid var(--line);border-radius:10px;padding:8px 12px;background:#fff;color:var(--ink)}
button{border:1px solid var(--teal);background:#fff;color:var(--teal);border-radius:10px;padding:5px 14px;cursor:pointer}button.p{background:var(--teal);color:#fff}button.d{border-color:#B3362B;color:#B3362B}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;border-bottom:1px solid var(--line);padding:10px 0;position:sticky;top:0;background:#fff;z-index:5}.bar button.on{background:var(--teal);color:#fff}
.row{display:flex;gap:10px;align-items:center;justify-content:space-between;border:1px solid var(--line);border-radius:12px;padding:8px 14px;margin:8px 0;flex-wrap:wrap}
.tag{font-size:12px;border-radius:99px;padding:0 10px;border:1px solid var(--gold);color:var(--gold)}.tag.pub{background:var(--teal);color:#fff;border-color:var(--teal)}
form,.box{border:1px solid var(--line);border-radius:14px;padding:16px;display:grid;gap:12px;margin:10px 0}label{display:flex;flex-direction:column;gap:4px;font-size:14px;font-weight:500}
.mini{display:grid;grid-template-columns:1fr 1fr auto;gap:8px;margin-top:6px}.fmt{display:flex;gap:6px;flex-wrap:wrap;align-items:center;padding:8px;background:#f8f7f2;border:1px solid var(--line);border-radius:10px}.fmt button{min-width:36px;padding:4px 9px}.fmt input[type=color]{width:42px;height:36px;padding:3px}.fmt select{width:auto;min-width:150px}.hint{font-size:12px;color:var(--mute)}.node{border-inline-start:2px solid var(--gold);padding:2px 14px;margin:12px 0}
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:8px 20px;border-radius:99px;display:none}small{color:var(--mute)}

.admin-nav{align-content:start}.nav-group{margin:14px 6px 2px;font-size:11px;letter-spacing:.06em;color:rgba(255,255,255,.55);font-weight:700}
.admin-user{margin-top:auto;display:flex;align-items:center;gap:10px;padding:12px 8px 4px;border-top:1px solid rgba(255,255,255,.18)}
.admin-avatar{flex:none;width:38px;height:38px;border-radius:50%;background:#A9844B;color:#fff;display:grid;place-items:center;font-weight:800;font-size:16px}
.admin-user-info{min-width:0;flex:1;display:flex;flex-direction:column}.admin-user-info b{font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.admin-user-info small{font-size:12px;color:rgba(255,255,255,.7)}
.admin-out-ico{flex:none;width:36px;height:36px;padding:0;border-radius:10px;background:transparent;color:#fff;border:1px solid rgba(255,255,255,.4);font-size:18px;cursor:pointer}
.mob-user{color:#56706E;font-weight:700}

.staff-card summary{display:flex;align-items:center;gap:10px;cursor:pointer;list-style:none}.staff-card summary::-webkit-details-marker{display:none}
#addbox>summary{cursor:pointer;list-style:none}#addbox>summary::-webkit-details-marker{display:none}
.admin-avatar.sm{width:34px;height:34px;font-size:14px}
.sc-main{flex:1;min-width:0;display:flex;flex-direction:column}.sc-main small{color:var(--mute);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sc-body{display:grid;gap:14px;margin-top:12px;padding-top:12px;border-top:1px solid var(--line)}
.sc-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}.sc-sec{display:grid;gap:8px}
.sc-pw{display:flex;gap:6px;flex-wrap:wrap}.sc-pw input{flex:1;min-width:180px}
.staff-tools{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}.staff-tools input,.staff-tools select{flex:1;min-width:140px}
</style>

:root{--teal:#0E5E5B;--deep:#083B3A;--gold:#A9844B;--gold-ink:#7E5F2B;--gold-soft:#F4ECDA;--ink:#12302F;--mute:#4F6A68;--line:#DAD5C6;
 --display:"TS Safaa","Reem Kufi",sans-serif;--text:"GE SS Two","IBM Plex Sans Arabic",system-ui,sans-serif}
body{font-family:var(--text);font-size:16px;line-height:1.85;-webkit-font-smoothing:antialiased}
h2,h4{font-family:var(--display);font-weight:700}
h2{font-size:30px;margin:26px 0 12px;display:flex;align-items:center;gap:12px}
h2::before{content:"";width:6px;height:28px;border-radius:3px;background:var(--gold)}
input,select,textarea,button{font-family:var(--text)}
input,select,textarea{border-color:#CBC6B5;border-radius:12px;padding:10px 14px;transition:border-color .2s,box-shadow .2s}
input:focus,select:focus,textarea:focus{outline:0;border-color:var(--teal);box-shadow:0 0 0 4px rgba(14,94,91,.13)}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
button{font-weight:500;border-radius:12px;padding:6px 16px;transition:background .2s,color .2s,border-color .2s,transform .2s}
button:hover{background:var(--wash,#EDF4F2)}
button.p{background:var(--teal);color:#fff;box-shadow:0 2px 0 var(--deep)}button.p:hover{background:var(--deep);transform:translateY(-1px)}
button.d:hover{background:#FBEDEB}
.bar{padding:12px 0;gap:8px;border-bottom:2px solid var(--gold);background:rgba(255,255,255,.94);backdrop-filter:blur(8px)}
.bar button{border-color:var(--line);color:var(--ink)}.bar button:hover{border-color:var(--gold);background:var(--gold-soft)}
.bar button.on,.bar button.on:hover{background:var(--teal);color:#fff;border-color:var(--teal)}
.bar button.d{color:#B3362B;border-color:#B3362B}
.row{border-radius:14px;padding:12px 16px;transition:border-color .2s,box-shadow .2s}
.row:hover{border-color:var(--gold);box-shadow:0 14px 26px -22px rgba(8,59,58,.5)}
.tag{font:500 12px var(--text);padding:1px 12px;color:var(--gold-ink)}
form,.box{border-radius:6px 34px 6px 6px;border-top:4px solid var(--gold);padding:22px;box-shadow:0 30px 56px -44px rgba(8,59,58,.45)}
#lf,form#lf{max-width:440px;margin:40px auto}
label{font-weight:500}
.fmt{border-radius:12px;background:#FAF8F2}
.node{border-inline-start-width:3px;padding:4px 18px}
#toast{font-weight:500;background:var(--deep);border-bottom:3px solid var(--gold);border-radius:14px;padding:10px 24px}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

</style>

const genPw=()=>{const A='ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnpqrstuvwxyz23456789',r=new Uint32Array(14);crypto.getRandomValues(r);return [...r].map(x=>A[x%A.length]).join('')+'#7a'};

const STAFFERR=m=>/Could not find the function|schema cache/i.test(m)?'نفّذ ملف supabase_staff_direct.sql في Supabase SQL Editor أولًا':/signups? (not allowed|are disabled)|signup.*disabled/i.test(m)?'تسجيل المستخدمين الجدد معطّل في Supabase. فعّل Authentication > Sign In / Providers > Allow new users to sign up':/rate limit/i.test(m)?'تجاوزت حد إرسال البريد في Supabase. عطّل Confirm email من إعدادات Authentication أو انتظر قليلًا':m;
async function callStaff(b){
 try{
  if(b.action=='create'){
   const email=(b.email||'').trim().toLowerCase(),pw=genPw();let existing=false;
   const s=await tmpClient().auth.signUp({email,password:pw,options:{data:{full_name:b.full_name}}});
   if(s.error){if(/already|registered|exists/i.test(s.error.message))existing=true;else throw s.error}
   else if(Array.isArray(s.data?.user?.identities)&&!s.data.user.identities.length)existing=true;
   const r=await db.rpc('staff_upsert_by_email',{p_email:email,p_name:b.full_name||'',p_role:b.role,p_committee:b.committee||'',p_perms:b.permissions||[]});
   if(r.error)throw r.error;
   try{await db.rpc('staff_notify',{p_user:r.data,p_title:'مرحبًا بك في إدارة النادي',p_body:'تمت إضافتك إلى لوحة الإدارة. افتح الأقسام المتاحة لك من القائمة.'})}catch(_){}
   return {email,temp_password:existing?null:pw,existing}
  }
  if(b.action=='update'){
   const r=await db.rpc('staff_update',{p_user:b.user_id,p_perms:b.permissions??null,p_active:b.is_active??null});
   if(r.error)throw r.error;return {ok:true}
  }
  if(b.action=='profile'){
   const r=await db.rpc('staff_update_profile',{p_user:b.user_id,p_name:b.full_name||'',p_role:b.role,p_committee:b.committee||'',p_role_title:b.role_title||''});
   if(r.error)throw r.error;return {ok:true}
  }
  if(b.action=='setpw'){
   const r=await db.rpc('staff_set_password',{p_user:b.user_id,p_password:b.password});
   if(r.error)throw r.error;return {ok:true}
  }
  if(b.action=='reset'){
   const pw=genPw(),r=await db.rpc('staff_set_password',{p_user:b.user_id,p_password:pw});
   if(r.error)throw r.error;return {temp_password:pw}
  }
  if(b.action=='delete'){const r=await db.rpc('staff_delete',{p_user:b.user_id});if(r.error)throw r.error;return {result:r.data}}
  if(b.action=='notify'){const r=await db.rpc('staff_notify',{p_user:b.user_id||null,p_title:b.title,p_body:b.body||''});if(r.error)throw r.error;return {sent:r.data}}
  throw new Error('إجراء غير معروف')
 }catch(e){console.error('[staff]',e);e.message=STAFFERR(e.message||String(e));toast(e.message,7000);e.__shown=true;throw e}
}

function fmtLines(ta,pre){const v=ta.value,a=ta.selectionStart,b=ta.selectionEnd,s0=a?v.lastIndexOf('\n',a-1)+1:0;let e=v.indexOf('\n',b);if(e<0)e=v.length;const re=pre.trim()=='##'?/^\s*##[ \t]*/:/^\s*[-•–][ \t]+/,seg=v.slice(s0,e).split('\n'),ne=seg.filter(l=>l.trim()),on=ne.length&&ne.every(l=>re.test(l)),out=seg.map(l=>!l.trim()?l:on?l.replace(re,''):pre+l.replace(re,'')).join('\n');ta.value=v.slice(0,s0)+out+v.slice(e);ta.focus();ta.setSelectionRange(s0,s0+out.length)}

 const showQR=async s=>{const url=PUB()+'#/attend/'+s.code;let im='';try{im=await qrURL(url,300)}catch(e){return toast(e.message,6000)}
  const m=modal(`<h3>${esc(s.title)}</h3><img src="${im}" width="280" alt="QR"><input readonly dir="ltr" value="${esc(url)}"><div class="dz-a"><button data-c>نسخ الرابط</button><button data-p>طباعة الملصق</button></div>`);
  m.querySelector('[data-c]').onclick=()=>copyTxt(url);m.querySelector('[data-p]').onclick=()=>printHTML(`<!doctype html><html dir="rtl"><meta charset="utf-8"><body style="font-family:sans-serif;text-align:center;padding:40px"><h1>${esc(s.title)}</h1><h2>امسح الرمز لتسجيل حضورك</h2><img src="${im}" width="420"><p dir="ltr">${esc(url)}</p><p>نادي الدراسات القضائية والأنظمة — جامعة أم القرى</p>`)};
 const showRec=s=>{const L=R.filter(r=>r.session_id==s.id);const m=modal(`<h3>كشف حضور: ${esc(s.title)} (${L.length})</h3><div style="overflow-x:auto;max-height:50vh"><table class="tbl"><tr><th>م</th><th>الاسم</th><th>الرقم الجامعي</th><th>الوقت</th><th></th></tr>${L.map((r,i)=>`<tr><td>${i+1}</td><td>${esc(r.full_name)}</td><td dir="ltr">${esc(r.university_id)}</td><td>${esc(fdt(r.checked_in_at))}</td><td><button class="d" data-r="${r.id}">حذف</button></td></tr>`).join('')||'<tr><td colspan="5">لا يوجد حضور بعد</td></tr>'}</table></div><div class="dz-a"><button data-e>تصدير CSV</button><button data-p>طباعة الكشف</button></div>`);
  m.querySelector('[data-e]').onclick=()=>dlCSV('attendance-'+s.code+'.csv',[['م','الاسم','الرقم الجامعي','التواصل','وقت التسجيل'],...L.map((r,i)=>[i+1,r.full_name,r.university_id,r.contact||'',fdt(r.checked_in_at)])]);
  m.querySelector('[data-p]').onclick=()=>printHTML(`<!doctype html><html dir="rtl"><meta charset="utf-8"><body style="font-family:sans-serif;padding:20px"><h2>كشف حضور: ${esc(s.title)}</h2><p>${esc(s.location||'')} ${esc(fdt(s.starts_at))} · العدد ${L.length}</p><table border="1" cellpadding="6" style="border-collapse:collapse;width:100%"><tr><th>م</th><th>الاسم</th><th>الرقم الجامعي</th><th>الوقت</th><th>التوقيع</th></tr>${L.map((r,i)=>`<tr><td>${i+1}</td><td>${esc(r.full_name)}</td><td>${esc(r.university_id)}</td><td>${esc(fdt(r.checked_in_at))}</td><td></td></tr>`).join('')}</table>`);
  m.querySelectorAll('[data-r]').forEach(b=>b.onclick=async()=>{if(!await askDel('حذف سجل حضور هذا المشارك؟'))return;await db.from('attendance_records').delete().eq('id',b.dataset.r).then(ok);m.remove();attAdmin(h)})};
 document.getElementById('asf').onsubmit=async e=>{e.preventDefault();const f=e.target,iso=x=>x?new Date(x).toISOString():null,code=(rid()+rid()+rid()).slice(0,12);
  const r=await db.from('attendance_sessions').insert({code,title:f.t.value.trim(),location:f.l.value.trim()||null,committee:f.c.value||null,starts_at:iso(f.s.value),ends_at:iso(f.e.value),created_by_name:ME.name||''}).select().single();if(r.error)return sqlErr(h,r.error);toast('تم إنشاء الجلسة');await attAdmin(h);showQR(r.data)};
 h.querySelectorAll('[data-s]').forEach(c=>c.onclick=async e=>{const b=e.target.closest('[data-a]');if(!b)return;const s=S.find(x=>x.id==c.dataset.s);
  if(b.dataset.a=='qr')showQR(s);else if(b.dataset.a=='rec')showRec(s);
  else if(b.dataset.a=='tg'){await db.from('attendance_sessions').update({is_open:!s.is_open}).eq('id',s.id).select('id').then(r=>okRows(r));attAdmin(h)}
  else if(b.dataset.a=='cert')issueFromSession(s,R.filter(r=>r.session_id==s.id));
  else if(await askDel('حذف جلسة «'+s.title+'» وكل سجلات الحضور فيها؟',{strong:true})){await db.from('attendance_sessions').delete().eq('id',s.id).then(ok);toast('تم الحذف');attAdmin(h)}})}

/* ---- الشهادات ---- */
const CK={participation:'شهادة مشاركة',volunteering:'شهادة تطوع',attendance:'شهادة حضور'},CV={participation:'شارك في',volunteering:'تطوّع في',attendance:'حضر'};
const vno=()=>{const A='ABCDEFGHJKLMNPQRSTUVWXYZ23456789',r=new Uint32Array(6);crypto.getRandomValues(r);return 'UQL-'+new Date().getFullYear()+'-'+[...r].map(x=>A[x%A.length]).join('')};
async function insCerts(rows){for(let t=0;t<3;t++){const r=await db.from('certificates').insert(rows.map(x=>({...x,verify_no:vno()}))).select();if(!r.error)return r.data;if(r.error.code!='23505')throw r.error}throw new Error('تعذّر توليد أرقام تحقق فريدة')}
async function issueFromSession(s,L){if(!L.length)return toast('لا يوجد حاضرون في هذه الجلسة');
 const have=new Set((await db.from('certificates').select('university_id').eq('session_id',s.id).then(ok)).map(x=>x.university_id)),T=L.filter(r=>!have.has(r.university_id));
 if(!T.length)return toast('أُصدرت شهادات لجميع الحاضرين مسبقًا');if(!confirm('إصدار '+T.length+' شهادة حضور لحاضري «'+s.title+'»؟'))return;
 try{await insCerts(T.map(r=>({kind:'attendance',recipient_name:r.full_name,university_id:r.university_id,title:s.title,issued_on:new Date().toISOString().slice(0,10),issuer_name:ME.name||'',issuer_title:'الموارد البشرية',session_id:s.id})));toast('تم إصدار '+T.length+' شهادة، تجدونها في تبويب الشهادات',5000)}catch(e){toast(e.message,6000)}}
async function certPrint(c){const link=PUB()+'#/verify/'+c.verify_no,qr=await qrURL(link,180);
 printHTML(`<!doctype html><html dir="rtl" lang="ar"><meta charset="utf-8"><title>${esc(c.verify_no)}</title><link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap" rel="stylesheet"><style>@page{size:A4 landscape;margin:0}*{box-sizing:border-box}body{margin:0;font-family:Cairo,sans-serif;color:#12302F}.c{width:297mm;height:209mm;padding:12mm}.f{height:100%;border:3px solid #A9844B;outline:1px solid #A9844B;outline-offset:-9px;padding:12mm 16mm;text-align:center;display:flex;flex-direction:column;justify-content:space-between}.u{font-size:26px;font-weight:700;color:#0E5E5B}.u2{color:#56706E}h1{font-size:46px;color:#0E5E5B;margin:4px 0}h2{font-size:38px;margin:10px 0;border-bottom:2px solid #A9844B;display:inline-block;padding:0 30px}p{font-size:21px;line-height:2;margin:4px 0}.ft{display:flex;justify-content:space-between;align-items:flex-end;text-align:center}.v{font-size:12px}</style><div class="c"><div class="f"><div><div class="u">جامعة أم القرى</div><div class="u2">نادي الدراسات القضائية والأنظمة</div></div><div><h1>${CK[c.kind]}</h1><p>يشهد نادي الدراسات القضائية والأنظمة بأن</p><h2>${esc(c.recipient_name)}</h2><p>${CV[c.kind]} «${esc(c.title)}»${c.hours?` لمدة ${esc(c.hours)} ساعة`:''}<br>وذلك بتاريخ ${esc(c.issued_on||'')}</p></div><div class="ft"><div><b>${esc(c.issuer_name||'')}</b><br>${esc(c.issuer_title||'')}</div><div class="v"><img src="${qr}" width="86"><br>رقم التحقق: <b dir="ltr">${esc(c.verify_no)}</b><br><span dir="ltr">${esc(link)}</span></div></div></div></div>`)}
async function certAdmin(h){let C,q='';try{C=await db.from('certificates').select('*').order('created_at',{ascending:false}).limit(500).then(ok)}catch(e){return sqlErr(h,e)}
 const today=new Date().toISOString().slice(0,10),L=()=>C.filter(c=>!q||[c.recipient_name,c.verify_no,c.title,c.university_id].join(' ').includes(q)).slice(0,100);
 const rows=()=>L().map(c=>`<div class="box" data-c="${c.id}"><div><b>${esc(c.recipient_name)}</b> <span class="tag ${c.status=='valid'?'pub':''}">${c.status=='valid'?esc(CK[c.kind]):'ملغاة'}</span><br><small>${esc(c.title)} · <span dir="ltr">${esc(c.verify_no)}</span></small></div><div class="record-actions"><button data-a="pr">عرض / طباعة</button><button data-a="lk">نسخ رابط التحقق</button>${c.status=='valid'?'<button class="d" data-a="rv">إلغاء الشهادة</button>':''}<button class="d" data-a="del">حذف</button></div></div>`).join('')||'<p class="hint">لا توجد شهادات.</p>';
 h.innerHTML=`<h3>الشهادات الإلكترونية</h3><p class="hint">لكل شهادة رقم تحقق ورابط يتأكد منه أي شخص من صحتها في صفحة «التحقق من شهادة».</p>
 <details class="box"><summary><b>+ إصدار شهادة</b></summary><form id="cf"><label>النوع<select name="k"><option value="participation">مشاركة</option><option value="volunteering">تطوع</option><option value="attendance">حضور</option></select></label><label>اسم المستفيد *<input name="n" required></label><label>الرقم الجامعي<input name="u" dir="ltr"></label><label>الفعالية / النشاط *<input name="t" required></label><label>عدد الساعات (اختياري)<input name="hr" type="number" step="any" min="0"></label><label>تاريخ الإصدار<input name="d" type="date" value="${today}"></label><label>اسم المُصدِر<input name="i" value="${esc(ME.name||'')}"></label><label>صفته<input name="it" value="رئيس الموارد البشرية"></label><button class="p">إصدار الشهادة</button></form></details>
 <input id="cq" placeholder="بحث بالاسم أو رقم التحقق أو الفعالية"><div id="cl">${rows()}</div>`;
 const bind=()=>h.querySelectorAll('[data-c]').forEach(el=>el.onclick=async e=>{const b=e.target.closest('[data-a]');if(!b)return;const c=C.find(x=>x.id==el.dataset.c);
  if(b.dataset.a=='pr')certPrint(c).catch(x=>toast(x.message,6000));else if(b.dataset.a=='lk')copyTxt(PUB()+'#/verify/'+c.verify_no);
  else if(b.dataset.a=='rv'){const why=prompt('سبب إلغاء الشهادة (يُحفظ في السجل)');if(why===null)return;await db.from('certificates').update({status:'revoked',revoked_reason:why||null}).eq('id',c.id).select('id').then(r=>okRows(r));certAdmin(h)}
  else if(await askDel('حذف شهادة «'+c.recipient_name+'» نهائيًا؟ سيتوقف رابط التحقق عن العمل.',{strong:true})){await db.from('certificates').delete().eq('id',c.id).then(ok);certAdmin(h)}});bind();
 document.getElementById('cq').oninput=e=>{q=e.target.value.trim();document.getElementById('cl').innerHTML=rows();bind()};
 document.getElementById('cf').onsubmit=async e=>{e.preventDefault();const f=e.target;try{const [c]=await insCerts([{kind:f.k.value,recipient_name:f.n.value.trim(),university_id:f.u.value.trim()||null,title:f.t.value.trim(),hours:f.hr.value?+f.hr.value:null,issued_on:f.d.value||today,issuer_name:f.i.value.trim()||null,issuer_title:f.it.value.trim()||null}]);toast('تم الإصدار: '+c.verify_no,4000);await certAdmin(h);certPrint(c)}catch(err){sqlErr(h,err)}}}

/* ---- المهام والتكليفات ---- */
async function taskAdmin(h){let T,fc='',fs='';try{T=await db.from('tasks').select('*').order('due_date',{ascending:true,nullsFirst:false}).then(ok)}catch(e){return sqlErr(h,e)}
 const today=new Date().toISOString().slice(0,10),late=t=>t.progress<100&&t.due_date&&t.due_date<today,F=()=>T.filter(t=>(!fc||t.committee==fc)&&(!fs||(fs=='done'?t.progress>=100:fs=='late'?late(t):t.progress<100&&!late(t))));
 const card=t=>`<div class="box" data-t="${t.id}"><div><b>${esc(t.title)}</b> ${t.committee?`<span class="tag">${esc(t.committee)}</span>`:''}${t.progress>=100?' <span class="tag pub">مكتملة</span>':late(t)?' <span class="tag late">متأخرة</span>':''}<br><small>المسؤول: ${esc(t.owner_name||'—')} · المكلّف: ${esc(t.assignee||'—')} · الموعد: <span class="${late(t)?'late':''}">${esc(t.due_date||'غير محدد')}</span></small>${t.description?`<p>${esc(t.description)}</p>`:''}</div><div class="pbar"><i style="width:${t.progress}%"></i></div><div class="record-actions"><label style="flex-direction:row;align-items:center;gap:8px">الإنجاز <input type="range" min="0" max="100" step="5" value="${t.progress}" data-p style="width:140px"> <b data-pv>${t.progress}%</b></label><button data-a="ed">تعديل</button><button class="d" data-a="del">حذف</button></div></div>`;
 const draw=(ed)=>{const n=T.length,dn=T.filter(t=>t.progress>=100).length,lt=T.filter(late).length;
  h.innerHTML=`<h3>المهام والتكليفات</h3><p class="hint">${n} مهمة · ${dn} مكتملة · ${lt} متأخرة</p>
  <details class="box" ${ed?'open':''}><summary><b>${ed&&ed.id?'تعديل مهمة':'+ مهمة جديدة'}</b></summary><form id="tf"><label>عنوان المهمة *<input name="t" required value="${esc(ed?.title||'')}"></label><label>اللجنة<select name="c">${deptOpts(ed?.committee||'')}</select></label><label>المكلّف (عضو أو أعضاء)<input name="a" value="${esc(ed?.assignee||'')}"></label><label>المسؤول عن المتابعة<input name="o" value="${esc(ed?.owner_name||ME.name||'')}"></label><label>الموعد النهائي<input name="d" type="date" value="${esc(ed?.due_date||'')}"></label><label>نسبة الإنجاز %<input name="p" type="number" min="0" max="100" value="${ed?.progress??0}"></label><label>التفاصيل<textarea name="x" rows="3">${esc(ed?.description||'')}</textarea></label><button class="p">${ed&&ed.id?'حفظ التعديل':'إضافة المهمة'}</button></form></details>
  <div class="row"><select id="tfc">${deptOpts(fc,'كل اللجان')}</select><select id="tfs"><option value="">كل الحالات</option><option value="open" ${fs=='open'?'selected':''}>قيد التنفيذ</option><option value="late" ${fs=='late'?'selected':''}>متأخرة</option><option value="done" ${fs=='done'?'selected':''}>مكتملة</option></select></div><div id="tl">${F().map(card).join('')||'<p class="hint">لا توجد مهام.</p>'}</div>`;
  document.getElementById('tfc').onchange=e=>{fc=e.target.value;draw()};document.getElementById('tfs').onchange=e=>{fs=e.target.value;draw()};
  document.getElementById('tf').onsubmit=async e=>{e.preventDefault();const f=e.target,o={title:f.t.value.trim(),committee:f.c.value||null,assignee:f.a.value.trim()||null,owner_name:f.o.value.trim()||null,due_date:f.d.value||null,progress:Math.min(100,Math.max(0,+f.p.value||0)),description:f.x.value.trim()||null,updated_at:new Date().toISOString()};
   const r=await(ed&&ed.id?db.from('tasks').update(o).eq('id',ed.id).select():db.from('tasks').insert(o).select());if(r.error)return sqlErr(h,r.error);toast('تم الحفظ');taskAdmin(h)};
  h.querySelectorAll('[data-t]').forEach(el=>{const t=T.find(x=>x.id==el.dataset.t),rg=el.querySelector('[data-p]');rg.oninput=()=>el.querySelector('[data-pv]').textContent=rg.value+'%';
   rg.onchange=async()=>{const r=await db.from('tasks').update({progress:+rg.value,updated_at:new Date().toISOString()}).eq('id',t.id).select('id');if(r.error||!r.data?.length)return toast('لم يُحفظ التغيير');t.progress=+rg.value;draw()};
   el.onclick=async e=>{const b=e.target.closest('[data-a]');if(!b)return;if(b.dataset.a=='ed'){draw(t);scrollTo({top:0,behavior:'smooth'})}else if(await askDel('حذف مهمة «'+t.title+'»؟')){await db.from('tasks').delete().eq('id',t.id).then(ok);taskAdmin(h)}}})};
 draw()}

boot();
</script>
</body>
</html>
