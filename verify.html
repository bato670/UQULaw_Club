<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>التحقق من الشهادات | نادي الدراسات القضائية والأنظمة</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--teal:#0E5E5B;--deep:#083B3A;--gold:#A9844B;--ink:#12302F;--line:#DAD5C6}*{box-sizing:border-box}body{margin:0;background:#f7f6f1;color:var(--ink);font-family:'IBM Plex Sans Arabic',sans-serif;min-height:100vh;display:grid;place-items:center;padding:18px}.card{width:min(100%,620px);background:#fff;border:1px solid var(--line);border-top:5px solid var(--gold);border-radius:8px 28px 8px 8px;padding:clamp(20px,5vw,40px);box-shadow:0 24px 60px #083b3a12}.brand{color:var(--teal);font-weight:700;font-size:20px}.sub{color:#617572;margin-top:3px}.divider{height:1px;background:var(--line);margin:22px 0}label{display:block;font-weight:600;margin-bottom:8px}input{width:100%;padding:13px;border:1px solid var(--line);border-radius:10px;font:inherit}button{margin-top:12px;background:var(--teal);color:#fff;border:0;border-radius:10px;padding:12px 22px;font:inherit;cursor:pointer}.result{margin-top:22px;padding:18px;border-radius:12px;background:#f6f8f6;display:none}.status{display:inline-block;border-radius:30px;padding:4px 12px;font-size:13px;font-weight:700}.valid{background:#e1f3e9;color:#17663c}.revoked{background:#fae7e5;color:#a22d27}.item{padding:9px 0;border-bottom:1px solid #e9e6dc}.item:last-child{border:0}.muted{color:#687875;font-size:13px}.error{color:#a22d27}.foot{margin-top:22px;color:#77837f;font-size:12px;text-align:center}
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
</head><body><main class="card"><div class="brand">جامعة أم القرى</div><div class="sub">نادي الدراسات القضائية والأنظمة</div><div class="divider"></div><h2>التحقق من الشهادات الرقمية</h2><p class="muted">أدخل رقم التحقق الموجود على الشهادة أو افتح هذه الصفحة عبر رمز QR.</p><label for="no">رقم الشهادة</label><input id="no" placeholder="UQL-2026-XXXXXXXX" autocomplete="off" dir="ltr"><button id="go">تحقق من الشهادة</button><section class="result" id="result" aria-live="polite"></section><div class="foot">خدمة التحقق الرسمية — نادي الدراسات القضائية والأنظمة بجامعة أم القرى</div></main>
<script>
const SB_URL='https://dsinztikwvuqhhwrhisg.supabase.co',SB_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRzaW56dGlrd3Z1cWhod3JoaXNnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTA4NTQ2MDcsImV4cCI6MjEwNjQzMDYwN30.MhBz5vD_s4u87y6c0tz1LgPtx18sjuEir0tju0f-ieQ';
const db=window.supabase.createClient(SB_URL,SB_KEY);const $=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function verify(){const no=$('no').value.trim(),box=$('result');if(!no)return;box.style.display='block';box.textContent='جارٍ التحقق…';const {data,error}=await db.rpc('verify_certificate',{p_no:no});if(error){box.innerHTML='<p class="error">تعذّر التحقق حاليًا. يرجى المحاولة لاحقًا.</p>';return}if(!data?.found){box.innerHTML='<p class="error">لم يتم العثور على شهادة بهذا الرقم.</p>';return}const d=data;box.innerHTML=`<span class="status ${d.status==='valid'?'valid':'revoked'}">${d.status==='valid'?'شهادة سارية':'شهادة ملغاة'}</span><div class="item"><b>رقم الشهادة:</b> <span dir="ltr">${esc(d.verify_no)}</span></div><div class="item"><b>اسم المستفيد:</b> ${esc(d.recipient_name)}</div><div class="item"><b>الجهة المصدرة:</b> ${esc(d.issuer_name||'نادي الدراسات القضائية والأنظمة — جامعة أم القرى')}</div><div class="item"><b>نوع الشهادة:</b> ${esc(({participation:'مشاركة',attendance:'حضور',volunteering:'تطوع'})[d.kind]||'شهادة')}</div><div class="item"><b>الفعالية:</b> ${esc(d.title)}</div><div class="item"><b>تاريخ الإصدار:</b> ${esc(d.issued_on||'—')}</div>`}
$('go').onclick=verify;$('no').addEventListener('keydown',e=>{if(e.key==='Enter')verify()});const p=new URLSearchParams(location.search).get('no');if(p){$('no').value=p;verify()}
</script></body></html>
