<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#ffffff"><title>الملف المهني الموثّق — نادي الدراسات القضائية والأنظمة</title>
<style>
:root{color-scheme:light;--t:#0E5E5B;--g:#A9844B;--gs:#F4ECDA;--ink:#12302F;--mut:#5d7170}
*{box-sizing:border-box}html,body{margin:0;background:#fff}
body{font-family:system-ui,"Segoe UI",Tahoma,sans-serif;color:var(--ink);padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}
.pg{max-width:560px;margin:0 auto;padding:18px 18px 40px;position:relative}
.bgl{position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(90deg,rgba(14,94,91,.06) 0 1px,transparent 1px 34px);-webkit-mask:linear-gradient(#000,transparent 340px);mask:linear-gradient(#000,transparent 340px)}
.top{position:relative;display:flex;justify-content:space-between;align-items:center}
.top img{height:64px}.tag{font-size:12px;color:var(--g);border:1px solid var(--g);border-radius:99px;padding:4px 12px;font-weight:600}
.hero{position:relative;text-align:center;margin-top:22px}
.av{position:relative;width:132px;height:132px;margin:0 auto}
.av svg{position:absolute;inset:0;transform:rotate(-90deg)}.av circle{fill:none;stroke-linecap:round;stroke-dasharray:1;stroke-dashoffset:1;animation:dr 1.6s .2s cubic-bezier(.5,0,.2,1) forwards}
.av .a{stroke:var(--g);stroke-width:3}.av .b{stroke:var(--t);stroke-width:1.2;stroke-opacity:.5;animation-delay:.6s}
@keyframes dr{to{stroke-dashoffset:0}}
.av b{position:absolute;inset:14px;border-radius:50%;background:var(--t);color:#fff;font-size:46px;font-weight:500;display:flex;align-items:center;justify-content:center;opacity:0;transform:scale(.6);animation:pop .8s .5s cubic-bezier(.2,1.3,.3,1) forwards}
@keyframes pop{to{opacity:1;transform:none}}
h1{font-size:26px;margin:14px 0 2px;color:var(--t)}.role{color:var(--g);font-weight:600}
.chips{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:10px}.chips span{background:var(--gs);color:#6b4f1f;font-size:13px;padding:4px 12px;border-radius:99px}
.bio{margin:14px auto 0;max-width:430px;line-height:1.9;color:var(--mut)}
h2{font-size:15px;color:var(--t);margin:30px 0 10px;display:flex;align-items:center;gap:10px}h2:after{content:"";flex:1;height:1px;background:linear-gradient(90deg,var(--g),transparent)}
.bars{display:flex;justify-content:space-around;align-items:flex-end;height:210px;padding:0 6px;border-bottom:2px solid var(--t);position:relative}
.bar{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;width:22%}
.bar .n{font-size:22px;font-weight:600;color:var(--ink);margin-bottom:6px}
.bar i{display:block;width:16px;border-radius:99px 99px 0 0;background:var(--t);height:0;animation:gr 1.3s cubic-bezier(.3,.8,.2,1) forwards}
.bar:nth-child(2) i,.bar:nth-child(3) i{background:var(--g)}
@keyframes gr{to{height:var(--h)}}
.lb{display:flex;justify-content:space-around;margin-top:8px;font-size:12px;color:var(--mut);text-align:center}.lb span{width:22%}
.cert{border:1px solid #e6ece9;border-right:4px solid var(--g);border-radius:10px;padding:10px 14px;margin-bottom:8px;display:flex;justify-content:space-between;gap:10px;align-items:center}
.cert b{font-weight:600}.cert small{color:var(--mut);display:block;margin-top:2px}.cert em{font-style:normal;color:var(--t);font-weight:600;white-space:nowrap}
.ft{margin-top:30px;border-top:1px solid #e6ece9;padding-top:18px;display:flex;gap:16px;align-items:center}
#qr{padding:6px;border:1px solid #e6ece9;border-radius:10px;flex:none}.ft p{margin:0;font-size:12px;line-height:1.9;color:var(--mut)}
.btn{display:block;width:100%;margin-top:18px;border:0;border-radius:12px;background:var(--t);color:#fff;font:600 15px inherit;padding:13px;cursor:pointer}
.demo{background:var(--gs);color:#6b4f1f;text-align:center;font-size:13px;padding:8px;border-radius:8px;margin-bottom:12px}
.msg{text-align:center;padding:90px 20px;color:var(--mut)}
@media print{.btn,.demo,.bgl{display:none}.bar i{animation:none;height:var(--h)}}
</style></head><body><div class="pg"><div class="bgl"></div><div id="app"><div class="msg">جارٍ التحميل…</div></div></div>
